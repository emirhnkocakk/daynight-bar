# Gradle properties for toolchain detection
# Microsoft JDK installations - explicit paths for reliable detection
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.prefer-jre=false
# Explicit Microsoft JDK paths (Gradle 8.5+ supports Microsoft JDK detection)
org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-17.0.20.101-hotspot
org.gradle.java.installations.paths=C:/Program Files/Microsoft/jdk-21.0.12.101-hotspot

# JVM args for Gradle daemon
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Parallel execution
org.gradle.parallel=true
org.gradle.configureondemand=true

# Caching
org.gradle.caching=true